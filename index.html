<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beneficiary Data Entry Portal</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --primary-orange: #ff6b00;
      --primary-amber: #ff9500;
      --orange-glow: rgba(255, 107, 0, 0.45);
      --bg-dark: #0a0604;
      --surface-glass: rgba(24, 15, 11, 0.75);
      --border-glass: rgba(255, 107, 0, 0.2);
      --text-main: #fbf5f2;
      --text-muted: #a89f91;
      --input-bg: rgba(12, 8, 6, 0.6);
      --input-focus-border: #ff7d1a;
      --success: #10b981;
      --error: #f43f5e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(255, 107, 0, 0.22) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(255, 149, 0, 0.15) 0px, transparent 50%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient Glowing Orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.32;
      z-index: 0;
      pointer-events: none;
      animation: float 10s ease-in-out infinite alternate;
    }
    .orb-1 { width: 400px; height: 400px; background: #ff5500; top: -60px; left: -100px; }
    .orb-2 { width: 340px; height: 340px; background: #ffaa00; bottom: -60px; right: -80px; animation-delay: -5s; }

    @keyframes float {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(28px) scale(1.06); }
    }

    #header-container, #footer-container {
      width: 100%;
      max-width: 460px;
      z-index: 1;
    }

    /* Main Card */
    .form-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      background: var(--surface-glass);
      backdrop-filter: blur(30px) saturate(180%);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      border: 1px solid var(--border-glass);
      border-radius: 24px;
      padding: 34px 28px;
      box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 140, 0, 0.2);
    }

    .form-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 107, 0, 0.12);
      border: 1px solid rgba(255, 107, 0, 0.3);
      color: #ff9500;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    .form-header h2 {
      font-size: 24px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.5px;
    }
    .form-header p {
      color: var(--text-muted);
      font-size: 13px;
      margin-top: 4px;
    }

    /* Input Fields */
    .input-group {
      margin-bottom: 16px;
    }
    .input-group label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 600;
      color: #e7e0d8;
      margin-bottom: 7px;
      letter-spacing: 0.2px;
    }
    .input-group label span.hint {
      font-size: 10px;
      color: #ff9500;
      font-weight: 500;
    }
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-wrapper i.lead-icon {
      position: absolute;
      left: 15px;
      color: #78716c;
      font-size: 14px;
      pointer-events: none;
      transition: color 0.2s ease;
    }
    .input-wrapper input,
    .input-wrapper select {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid rgba(255, 107, 0, 0.18);
      border-radius: 12px;
      padding: 12px 14px 12px 42px;
      color: var(--text-main);
      font-size: 14px;
      font-weight: 500;
      outline: none;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      appearance: none;
      -webkit-appearance: none;
    }
    .input-wrapper select {
      cursor: pointer;
    }
    .input-wrapper select option {
      background: #1c130e;
      color: #fff;
    }
    .input-wrapper .select-arrow {
      position: absolute;
      right: 15px;
      color: #78716c;
      font-size: 12px;
      pointer-events: none;
      transition: color 0.2s;
    }
    .input-wrapper input::placeholder {
      color: #57534e;
    }
    .input-wrapper input:focus,
    .input-wrapper select:focus {
      border-color: var(--input-focus-border);
      background: rgba(20, 12, 8, 0.9);
      box-shadow: 0 0 0 4px rgba(255, 107, 0, 0.2);
    }
    .input-wrapper input:focus ~ i.lead-icon,
    .input-wrapper select:focus ~ i.lead-icon {
      color: #ff9500;
    }

    /* Submit Button */
    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #ff6b00 0%, #e65100 100%);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-top: 24px;
      transition: all 0.25s ease;
      box-shadow: 0 10px 25px -4px var(--orange-glow);
    }
    .btn-submit:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px -4px rgba(255, 107, 0, 0.6);
      filter: brightness(1.1);
    }
    .btn-submit:active:not(:disabled) {
      transform: translateY(0);
    }
    .btn-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      box-shadow: none;
    }

    .spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Alert Banner */
    .status-alert {
      display: none;
      margin-top: 18px;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      animation: slideUp 0.3s ease;
    }
    .status-alert.success {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(16, 185, 129, 0.12);
      color: #34d399;
      border: 1px solid rgba(52, 211, 153, 0.25);
    }
    .status-alert.error {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(244, 63, 94, 0.12);
      color: #fb7185;
      border: 1px solid rgba(251, 113, 133, 0.25);
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <!-- Header Injection -->
  <div id="header-container"></div>

  <!-- Form Module -->
  <div class="form-container">
    <div class="form-header">
      <div class="header-badge">
        <i class="fa-solid fa-bolt"></i> Fast Field Sync
      </div>
      <h2>Beneficiary Entry</h2>
      <p>Enter and verify beneficiary records</p>
    </div>

    <form id="sheetForm">
      <!-- Full Name -->
      <div class="input-group">
        <label>Full Name</label>
        <div class="input-wrapper">
          <input type="text" name="name" required placeholder="e.g. Rahul Sharma" autocomplete="off">
          <i class="fa-regular fa-user lead-icon"></i>
        </div>
      </div>

      <!-- Mobile Number (Strict 10 Digits Only) -->
      <div class="input-group">
        <label>Mobile Number <span class="hint">(Exact 10 digits)</span></label>
        <div class="input-wrapper">
          <input 
            type="tel" 
            id="phoneInput"
            name="phone" 
            inputmode="numeric"
            minlength="10" 
            maxlength="10" 
            pattern="[0-9]{10}" 
            title="Please enter exactly 10 numeric digits"
            required 
            placeholder="10-digit mobile number" 
            autocomplete="off"
            oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 10);"
          >
          <i class="fa-solid fa-phone lead-icon"></i>
        </div>
      </div>

      <!-- Health Card ID -->
      <div class="input-group">
        <label>Health Card ID</label>
        <div class="input-wrapper">
          <input type="text" name="healthCardId" required placeholder="e.g. HC-98765432" autocomplete="off">
          <i class="fa-solid fa-id-card lead-icon"></i>
        </div>
      </div>

      <!-- Health Centre Name -->
      <div class="input-group">
        <label>Health Centre Name</label>
        <div class="input-wrapper">
          <input type="text" name="healthCentre" required placeholder="e.g. Primary Health Centre" autocomplete="off">
          <i class="fa-solid fa-hospital lead-icon"></i>
        </div>
      </div>

      <!-- ASHA Dropdown -->
      <div class="input-group">
        <label>ASHA Worker</label>
        <div class="input-wrapper">
          <select name="ashaName" required>
            <option value="" disabled selected>Select ASHA Worker</option>
            <option value="Bijay Laxmi Pasi">Bijay Laxmi Pasi</option>
            <option value="Anita Ray Mahato">Anita Ray Mahato</option>
            <option value="Sharmila Tudu">Sharmila Tudu</option>
            <option value="Sumita Kisku">Sumita Kisku</option>
            <option value="Jhilik Mondal">Jhilik Mondal</option>
          </select>
          <i class="fa-solid fa-user-nurse lead-icon"></i>
          <i class="fa-solid fa-chevron-down select-arrow"></i>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        <span id="btnText">Save & Submit Record</span>
        <div class="spinner" id="spinner"></div>
      </button>
    </form>

    <div id="statusAlert" class="status-alert"></div>
  </div>

  <!-- Footer Injection -->
  <div id="footer-container"></div>

  <script>
    // 1. Asynchronous Load of Header & Footer
    fetch('header.html')
      .then(res => res.text())
      .then(data => document.getElementById('header-container').innerHTML = data)
      .catch(err => console.error('Header Load Error:', err));

    fetch('footer.html')
      .then(res => res.text())
      .then(data => document.getElementById('footer-container').innerHTML = data)
      .catch(err => console.error('Footer Load Error:', err));

    // 2. Apps Script Integration
    const SCRIPT_URL = 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE';

    const form = document.getElementById('sheetForm');
    const statusAlert = document.getElementById('statusAlert');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const spinner = document.getElementById('spinner');
    const phoneInput = document.getElementById('phoneInput');

    form.addEventListener('submit', e => {
      e.preventDefault();

      // Mobile Number Strict Length Verification
      if (phoneInput.value.length !== 10) {
        statusAlert.className = 'status-alert error';
        statusAlert.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Mobile number must be exactly 10 digits.';
        phoneInput.focus();
        return;
      }
      
      submitBtn.disabled = true;
      btnText.innerText = 'Syncing Record...';
      spinner.style.display = 'block';
      statusAlert.className = 'status-alert';
      statusAlert.innerText = '';

      const formData = new FormData(form);
      const data = Object.fromEntries(formData.entries());

      fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(data)
      })
      .then(res => res.json())
      .then(response => {
        statusAlert.className = 'status-alert success';
        statusAlert.innerHTML = '<i class="fa-solid fa-circle-check"></i> Beneficiary record saved successfully!';
        form.reset();
      })
      .catch(error => {
        statusAlert.className = 'status-alert error';
        statusAlert.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Sync failed. Please check internet connection.';
        console.error('Error:', error);
      })
      .finally(() => {
        submitBtn.disabled = false;
        btnText.innerText = 'Save & Submit Record';
        spinner.style.display = 'none';
      });
    });
  </script>

</body>
</html>
