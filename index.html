<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beneficiary Data Entry Portal</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: rgba(255, 255, 255, 0.04);
      --input-border: rgba(255, 255, 255, 0.15);
      --input-focus: #818cf8;
      --success-bg: rgba(34, 197, 94, 0.15);
      --success-text: #4ade80;
      --error-bg: rgba(239, 68, 68, 0.15);
      --error-text: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 25px 15px;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient Glow */
    body::before, body::after {
      content: '';
      position: absolute;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      filter: blur(100px);
      z-index: 0;
      opacity: 0.4;
      pointer-events: none;
    }
    body::before { background: #4f46e5; top: 5%; left: 10%; }
    body::after { background: #ec4899; bottom: 5%; right: 10%; }

    #header-container, #footer-container {
      width: 100%;
      max-width: 440px;
      z-index: 1;
    }

    .form-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 32px 26px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .form-header {
      text-align: center;
      margin-bottom: 22px;
    }
    .form-header .icon-badge {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--primary), #a855f7);
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #fff;
      margin-bottom: 12px;
      box-shadow: 0 6px 14px rgba(99, 102, 241, 0.35);
    }
    .form-header h2 {
      font-size: 21px;
      font-weight: 700;
      color: var(--text-main);
    }
    .form-header p {
      color: var(--text-muted);
      font-size: 13px;
      margin-top: 4px;
    }

    .input-group {
      margin-bottom: 16px;
    }
    .input-group label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-wrapper i {
      position: absolute;
      left: 14px;
      color: #64748b;
      font-size: 14px;
      pointer-events: none;
    }
    .input-wrapper input,
    .input-wrapper select {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      padding: 11px 14px 11px 38px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
      appearance: none;
      -webkit-appearance: none;
    }
    .input-wrapper select {
      cursor: pointer;
    }
    .input-wrapper select option {
      background: #1e1b4b;
      color: #fff;
    }
    .input-wrapper .select-arrow {
      position: absolute;
      right: 14px;
      left: auto;
      color: #64748b;
      font-size: 12px;
      pointer-events: none;
    }
    .input-wrapper input::placeholder {
      color: #64748b;
    }
    .input-wrapper input:focus,
    .input-wrapper select:focus {
      border-color: var(--input-focus);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 13px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-top: 22px;
      transition: all 0.25s ease;
      box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
    }
    .btn-submit:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 14px 24px -5px rgba(99, 102, 241, 0.5);
    }
    .btn-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }
    .spinner {
      display: none;
      width: 15px;
      height: 15px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .status-alert {
      display: none;
      margin-top: 15px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      text-align: center;
    }
    .status-alert.success {
      display: block;
      background: var(--success-bg);
      color: var(--success-text);
      border: 1px solid rgba(74, 222, 128, 0.25);
    }
    .status-alert.error {
      display: block;
      background: var(--error-bg);
      color: var(--error-text);
      border: 1px solid rgba(248, 113, 113, 0.25);
    }
  </style>
</head>
<body>

  <!-- Header Component Container -->
  <div id="header-container"></div>

  <!-- Form Component -->
  <div class="form-container">
    <div class="form-header">
      <div class="icon-badge">
        <i class="fa-solid fa-hospital-user"></i>
      </div>
      <h2>Beneficiary Entry</h2>
      <p>Fill out the details below</p>
    </div>

    <form id="sheetForm">
      <!-- Full Name -->
      <div class="input-group">
        <label>Full Name</label>
        <div class="input-wrapper">
          <input type="text" name="name" required placeholder="e.g. Rahul Sharma">
          <i class="fa-regular fa-user"></i>
        </div>
      </div>

      <!-- Mobile Number -->
      <div class="input-group">
        <label>Mobile Number</label>
        <div class="input-wrapper">
          <input type="tel" name="phone" pattern="[0-9]{10}" required placeholder="10-digit mobile number">
          <i class="fa-solid fa-phone"></i>
        </div>
      </div>

      <!-- Health Card ID -->
      <div class="input-group">
        <label>Health Card ID</label>
        <div class="input-wrapper">
          <input type="text" name="healthCardId" required placeholder="e.g. HC-98765432">
          <i class="fa-solid fa-id-card"></i>
        </div>
      </div>

      <!-- Health Centre Name -->
      <div class="input-group">
        <label>Health Centre Name</label>
        <div class="input-wrapper">
          <input type="text" name="healthCentre" required placeholder="e.g. Primary Health Centre">
          <i class="fa-solid fa-hospital"></i>
        </div>
      </div>

      <!-- ASHA Name Dropdown -->
      <div class="input-group">
        <label>ASHA Name</label>
        <div class="input-wrapper">
          <select name="ashaName" required>
            <option value="" disabled selected>Select ASHA Worker</option>
            <option value="Bijay Laxmi Pasi">Bijay Laxmi Pasi</option>
            <option value="Anita Ray Mahato">Anita Ray Mahato</option>
            <option value="Sharmila Tudu">Sharmila Tudu</option>
            <option value="Sumita Kisku">Sumita Kisku</option>
            <option value="Jhilik Mondal">Jhilik Mondal</option>
          </select>
          <i class="fa-solid fa-user-nurse"></i>
          <i class="fa-solid fa-chevron-down select-arrow"></i>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        <span id="btnText">Submit Data</span>
        <div class="spinner" id="spinner"></div>
      </button>
    </form>

    <div id="statusAlert" class="status-alert"></div>
  </div>

  <!-- Footer Component Container -->
  <div id="footer-container"></div>

  <script>
    // 1. Fetch Header & Footer
    fetch('header.html')
      .then(res => res.text())
      .then(data => document.getElementById('header-container').innerHTML = data)
      .catch(err => console.error('Header Load Error:', err));

    fetch('footer.html')
      .then(res => res.text())
      .then(data => document.getElementById('footer-container').innerHTML = data)
      .catch(err => console.error('Footer Load Error:', err));

    // 2. Apps Script Integration
    const SCRIPT_URL = 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE';

    const form = document.getElementById('sheetForm');
    const statusAlert = document.getElementById('statusAlert');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const spinner = document.getElementById('spinner');

    form.addEventListener('submit', e => {
      e.preventDefault();
      
      submitBtn.disabled = true;
      btnText.innerText = 'Submitting...';
      spinner.style.display = 'block';
      statusAlert.className = 'status-alert';
      statusAlert.innerText = '';

      const formData = new FormData(form);
      const data = Object.fromEntries(formData.entries());

      fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(data)
      })
      .then(res => res.json())
      .then(response => {
        statusAlert.className = 'status-alert success';
        statusAlert.innerHTML = '<i class="fa-regular fa-circle-check"></i> Data saved successfully!';
        form.reset();
      })
      .catch(error => {
        statusAlert.className = 'status-alert error';
        statusAlert.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Error! Failed to submit data.';
        console.error('Error:', error);
      })
      .finally(() => {
        submitBtn.disabled = false;
        btnText.innerText = 'Submit Data';
        spinner.style.display = 'none';
      });
    });
  </script>

</body>
</html>
