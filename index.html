<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Data Entry Portal</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: rgba(255, 255, 255, 0.04);
      --input-border: rgba(255, 255, 255, 0.15);
      --input-focus: #818cf8;
      --success-bg: rgba(34, 197, 94, 0.15);
      --success-text: #4ade80;
      --error-bg: rgba(239, 68, 68, 0.15);
      --error-text: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 25px 15px;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient Glow */
    body::before, body::after {
      content: '';
      position: absolute;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      filter: blur(100px);
      z-index: 0;
      opacity: 0.4;
      pointer-events: none;
    }
    body::before { background: #4f46e5; top: 5%; left: 10%; }
    body::after { background: #ec4899; bottom: 5%; right: 10%; }

    /* Main Container */
    #header-container, #footer-container {
      width: 100%;
      max-width: 440px;
      z-index: 1;
    }

    .form-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 32px 26px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .form-header {
      text-align: center;
      margin-bottom: 22px;
    }
    .form-header .icon-badge {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--primary), #a855f7);
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #fff;
      margin-bottom: 12px;
      box-shadow: 0 6px 14px rgba(99, 102, 241, 0.35);
    }
    .form-header h2 {
      font-size: 21px;
      font-weight: 700;
      color: var(--text-main);
    }
    .form-header p {
      color: var(--text-muted);
      font-size: 13px;
      margin-top: 4px;
    }

    .input-group {
      margin-bottom: 16px;
    }
    .input-group label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-wrapper i {
      position: absolute;
      left: 14px;
      color: #64748b;
      font-size: 14px;
    }
    .input-wrapper input,
    .input-wrapper textarea {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      padding: 10px 14px 10px 38px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }
    .input-wrapper textarea {
      padding-top: 10px;
      resize: vertical;
      min-height: 75px;
    }
    .input-wrapper input::placeholder,
    .input-wrapper textarea::placeholder {
      color: #64748b;
    }
    .input-wrapper input:focus,
    .input-wrapper textarea:focus {
      border-color: var(--input-focus);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
    }
    .btn-submit:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 14px 24px -5px rgba(99, 102, 241, 0.5);
    }
    .btn-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }
    .spinner {
      display: none;
      width: 15px;
      height: 15px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .status-alert {
      display: none;
      margin-top: 15px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      text-align: center;
    }
    .status-alert.success {
      display: block;
      background: var(--success-bg);
      color: var(--success-text);
      border: 1px solid rgba(74, 222, 128, 0.25);
    }
    .status-alert.error {
      display: block;
      background: var(--error-bg);
      color: var(--error-text);
      border: 1px solid rgba(248, 113, 113, 0.25);
    }
  </style>
</head>
<body>

  <!-- Dynamic Header Container -->
  <div id="header-container"></div>

  <!-- Form Component -->
  <div class="form-container">
    <div class="form-header">
      <div class="icon-badge">
        <i class="fa-solid fa-file-lines"></i>
      </div>
      <h2>डेटा एंट्री पोर्टल</h2>
      <p>Google Sheets ऑटोमेशन</p>
    </div>

    <form id="sheetForm">
      <div class="input-group">
        <label>पूरा नाम</label>
        <div class="input-wrapper">
          <input type="text" name="name" required placeholder="उदा. Rahul Sharma">
          <i class="fa-regular fa-user"></i>
        </div>
      </div>

      <div class="input-group">
        <label>मोबाइल नंबर</label>
        <div class="input-wrapper">
          <input type="tel" name="phone" pattern="[0-9]{10}" required placeholder="10 अंकों का नंबर">
          <i class="fa-solid fa-phone"></i>
        </div>
      </div>

      <div class="input-group">
        <label>ईमेल आईडी</label>
        <div class="input-wrapper">
          <input type="email" name="email" required placeholder="name@example.com">
          <i class="fa-regular fa-envelope"></i>
        </div>
      </div>

      <div class="input-group">
        <label>विवरण / संदेश</label>
        <div class="input-wrapper">
          <textarea name="message" rows="3" placeholder="यहाँ विवरण दर्ज करें..."></textarea>
          <i class="fa-regular fa-comment-dots" style="top: 13px;"></i>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        <span id="btnText">सबमिट करें</span>
        <div class="spinner" id="spinner"></div>
      </button>
    </form>

    <div id="statusAlert" class="status-alert"></div>
  </div>

  <!-- Dynamic Footer Container -->
  <div id="footer-container"></div>

  <script>
    // 1. Header और Footer को लोड करने का कोड
    fetch('header.html')
      .then(res => res.text())
      .then(data => document.getElementById('header-container').innerHTML = data)
      .catch(err => console.error('Header Load Error:', err));

    fetch('footer.html')
      .then(res => res.text())
      .then(data => document.getElementById('footer-container').innerHTML = data)
      .catch(err => console.error('Footer Load Error:', err));

    // 2. Google Sheet Submit Logic
    const SCRIPT_URL = 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE';

    const form = document.getElementById('sheetForm');
    const statusAlert = document.getElementById('statusAlert');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const spinner = document.getElementById('spinner');

    form.addEventListener('submit', e => {
      e.preventDefault();
      
      submitBtn.disabled = true;
      btnText.innerText = 'सेव हो रहा है...';
      spinner.style.display = 'block';
      statusAlert.className = 'status-alert';
      statusAlert.innerText = '';

      const formData = new FormData(form);
      const data = Object.fromEntries(formData.entries());

      fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(data)
      })
      .then(res => res.json())
      .then(response => {
        statusAlert.className = 'status-alert success';
        statusAlert.innerHTML = '<i class="fa-regular fa-circle-check"></i> डेटा सफलतापूर्वक सेव हो गया!';
        form.reset();
      })
      .catch(error => {
        statusAlert.className = 'status-alert error';
        statusAlert.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> एरर! डेटा सेव नहीं हो सका।';
        console.error('Error:', error);
      })
      .finally(() => {
        submitBtn.disabled = false;
        btnText.innerText = 'सबमिट करें';
        spinner.style.display = 'none';
      });
    });
  </script>

</body>
</html>
